name: Release

# Pushing a tag that is exactly the plugin version (0.2.0, no "v") builds the
# plugin and the CLI and publishes a GitHub release with main.js,
# manifest.json, styles.css and bilinear.js attached. Obsidian and BRAT
# install from the first three. The CLI is also published to npm, where
# `npx obsidian-bilinear` finds it. That uses npm's trusted publishing: npm
# accepts the publish because it comes from this workflow in this repository
# (set under the package's settings on npmjs.com), so there is no token.
#
# A release that stopped half way can be finished by running the workflow by
# hand with the tag: steps that are already done are skipped.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to release, e.g. 0.2.0
        required: true

permissions:
  contents: write
  id-token: write # lets npm verify that the publish comes from this workflow

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Check that the tag matches every version number
        run: node scripts/check_version.mjs "$TAG"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plugin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: plugin
      - run: pnpm build
        working-directory: plugin
      - run: pnpm test
        working-directory: plugin
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release view "$TAG" > /dev/null 2>&1 ||
          gh release create "$TAG" --verify-tag
          plugin/dist/main.js plugin/dist/manifest.json plugin/dist/styles.css cli/dist/bilinear.js
          --title "$TAG" --generate-notes
      - name: Publish the CLI to npm
        # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
        run: |
          npm install -g npm@latest
          if npm view "obsidian-bilinear@$TAG" version > /dev/null 2>&1; then
            echo "obsidian-bilinear $TAG is already on npm"
          else
            npm publish --access public
          fi
        working-directory: cli
